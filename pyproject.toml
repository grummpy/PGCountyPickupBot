[project]
name = "pgpickup"
version = "0.1.0"
description = "Prince George's County trash, recycling, yard-trim, and bulky pickup reminders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "icalendar>=6.1.0,<7",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.140.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
pgpickup = "pgpickup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgpickup = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
